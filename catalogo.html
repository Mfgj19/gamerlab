<!doctype html>
<html lang='es'>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>GamerLab | Catálogo</title>
</head>

<body class='d-flex flex-column min-vh-100' data-page='catalogo'>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html" aria-label="Ir al inicio de GamerLab">
                <img src="assets/img/logo/logo.png" alt="Logo de GamerLab" class="navbar-logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" data-page="inicio" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="catalogo" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item">
                        <a class="nav-link" data-page="carrito" href="carrito.html">
                            Carrito <span class="badge rounded-pill bg-danger" id="contadorCarrito">0</span>
                        </a>
                    </li>
                    <li class="nav-item"><a class="nav-link" data-page="perfil" href="perfil.html">Mi perfil</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="admin" href="admin.html">Administración</a></li>
                </ul>
                <button class="btn btn-outline-light btn-sm" id="btnLoginPlaceholder">Ingresar</button>
            </div>
        </div>
    </nav>
    <main class='flex-grow-1'>
        <div class="container py-5">
            <section class="py-5">
                <div class="container">

                    <div class="mb-4">
                        <span class="badge rounded-pill text-bg-info mb-2">GamerLab</span>
                        <h1 class="fw-bold">Catálogo de productos</h1>
                        <p class="text-secondary">
                            Explorá nuestra selección de equipos y periféricos gamer.
                        </p>
                    </div>
                    <div class="row g-3 mb-4">

                        <div class="col-md-4">
                            <label for="buscarProducto" class="form-label">Buscar producto</label>
                            <input type="text" class="form-control" id="buscarProducto"
                                placeholder="Ej: teclado, notebook...">
                        </div>

                        <div class="col-md-4">
                            <label for="filtroCategoria" class="form-label">Categoría</label>
                            <select class="form-select" id="filtroCategoria">
                                <option value="Todas">Todas las categorías</option>
                                <option value="Equipos">Equipos</option>
                                <option value="Periféricos">Periféricos</option>
                                <option value="Simulación">Simulación</option>
                                <option value="Mobiliario">Mobiliario</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="ordenProductos" class="form-label">Ordenar por</label>
                            <select class="form-select" id="ordenProductos">
                                <option value="Sin ordenar">Sin ordenar</option>
                                <option value="Precio menor">Precio: menor a mayor</option>
                                <option value="Precio mayor">Precio: mayor a menor</option>
                                <option value="Nombre AZ">Nombre: A-Z</option>
                                <option value="Nombre ZA">Nombre: Z-A</option>
                            </select>
                        </div>

                    </div>
                    <div class="mb-4">
                        <button type="button" class="btn btn-outline-primary" id="limpiarFiltros">
                            Limpiar filtros
                        </button>
                    </div>
                </div>

                <p class="text-secondary mb-3" id="cantidadResultados"></p>
                <div class="row g-4" id="catalogoProductos">
                    <!-- Las tarjetas se generarán desde JavaScript -->
                </div>

        </div>
        </section>
        </div>
    </main>
    <footer class="footer py-4 mt-auto">
        <div class="container d-flex justify-content-between flex-wrap gap-2">
            <span>© 2026 GamerLab · Proyecto académico de Desarrollo Web</span>
        </div>
    </footer>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="appToast" class="toast">
            <div class="toast-header"><strong class="me-auto">GamerLab</strong><button class="btn-close"
                    data-bs-dismiss="toast"></button></div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/base.js"></script>
    <script type="module" src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/catalogo.js"></script>
    <script type="module" src="js/firebase/auth.js"></script>
</body>

</html>
