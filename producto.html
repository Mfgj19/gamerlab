<!doctype html>
<html lang='es'>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>GamerLab | Producto</title>
</head>

<body class='d-flex flex-column min-vh-100' data-page='producto'>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html" aria-label="Ir al inicio de GamerLab">
                <img src="assets/img/logo/logo.png" alt="Logo de GamerLab" class="navbar-logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" data-page="inicio" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="catalogo" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item">
                        <a class="nav-link" data-page="carrito" href="carrito.html">
                            Carrito <span class="badge rounded-pill bg-danger" id="contadorCarrito">0</span>
                        </a>
                    </li>
                    <li class="nav-item"><a class="nav-link" data-page="perfil" href="perfil.html">Mi perfil</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="admin" href="admin.html">Administración</a></li>
                </ul>
                <button class="btn btn-outline-light btn-sm" id="btnLoginPlaceholder">Ingresar</button>
            </div>
        </div>
    </nav>
    <main class="flex-grow-1">
        <div class="container py-5">

            <div id="detalleProducto">
                <!-- El detalle del producto se mostrará desde JavaScript -->
            </div>
            <section class="mt-5" id="seccionValoraciones">
                <h2 class="h4 mb-3">Valoraciones</h2>

                <p class="text-secondary">
                    ¿Qué te pareció este producto?
                </p>

                <div id="estrellasValoracion" class="mb-3">
                    <button type="button" class="btn btn-outline-warning estrella" data-valor="1">★</button>
                    <button type="button" class="btn btn-outline-warning estrella" data-valor="2">★</button>
                    <button type="button" class="btn btn-outline-warning estrella" data-valor="3">★</button>
                    <button type="button" class="btn btn-outline-warning estrella" data-valor="4">★</button>
                    <button type="button" class="btn btn-outline-warning estrella" data-valor="5">★</button>
                </div>

                <p class="text-secondary" id="resumenValoraciones">
                    Este producto todavía no tiene valoraciones.
                </p>
            </section>
            <section class="mt-5" id="seccionRelacionados">
                <h2 class="h4 mb-4">Productos relacionados</h2>

                <div class="row g-4" id="productosRelacionados">
                    <!-- Los productos relacionados se mostrarán desde JavaScript -->
                </div>
            </section>

            <section class="mt-5" id="seccionComentarios">
                <h2 class="h4 mb-3">Comentarios</h2>

                <div class="mb-3">
                    <label for="comentarioProducto" class="form-label">
                        Dejá tu opinión
                    </label>

                    <textarea class="form-control" id="comentarioProducto" rows="3" maxlength="500"
                        placeholder="Escribí tu comentario..."></textarea>
                </div>

                <button type="button" class="btn btn-primary" id="publicarComentario">
                    Publicar comentario
                </button>

                <div class="mt-4" id="listaComentarios">
                    <!-- Los comentarios se mostrarán desde JavaScript -->
                </div>
            </section>

        </div>
    </main>
    <footer class="footer py-4 mt-auto">
        <div class="container d-flex justify-content-between flex-wrap gap-2">
            <span>© 2026 GamerLab · Proyecto académico de Desarrollo Web</span>
        </div>
    </footer>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="appToast" class="toast">
            <div class="toast-header"><strong class="me-auto">GamerLab</strong><button class="btn-close"
                    data-bs-dismiss="toast"></button></div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/base.js"></script>
    <script type="module" src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script type="module" src="js/producto.js"></script>
    <script type="module" src="js/firebase/auth.js"></script>
</body>

</html>
